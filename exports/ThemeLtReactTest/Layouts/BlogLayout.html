
export default function BlogLayout({ children }) {
  return (
    <div className="blog-layout">
      <header
        style={{
          padding: '24px',
          backgroundColor: '#1e293b',
          color: 'white',
          textAlign: 'center'
        }}
      >
        <h1>LifeTechOCMS Blog Layout</h1>
        <p>This is our second React Layout</p>
      </header>

      <main style={{ padding: '24px' }}>
        {children}
      </main>

      <footer
        style={{
          padding: '20px',
          backgroundColor: '#1e293b',
          color: 'white',
          textAlign: 'center'
        }}
      >
        Powered by LifeTechOCMS Blog
      </footer>
    </div>
  );
}
